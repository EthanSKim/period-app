<svg xmlns="http://www.w3.org/2000/svg" width="48" height="46" viewBox="0 0 48 46" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd6e8"/>
      <stop offset="55%" stop-color="#ffa8cf"/>
      <stop offset="100%" stop-color="#ff7ab8"/>
    </linearGradient>
    <linearGradient id="petal" x1="24" y1="9" x2="24" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffeaf4"/>
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="60%" stop-color="#ffb8d4"/>
      <stop offset="100%" stop-color="#ff8fbb"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.35" cy="0.22" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#d6357e" flood-opacity="0.3"/>
    </filter>
    <clipPath id="roundedSquare">
      <rect x="0" y="0" width="48" height="46" rx="13" ry="13"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="48" height="46" rx="13" ry="13" fill="url(#bg)"/>

  <g clip-path="url(#roundedSquare)">
    <!-- ambient glow blobs for depth -->
    <ellipse cx="8" cy="7" rx="14" ry="10" fill="#ffffff" opacity="0.35" filter="url(#blur1)"/>
    <ellipse cx="41" cy="40" rx="16" ry="12" fill="#ff6fae" opacity="0.35" filter="url(#blur1)"/>
    <ellipse cx="6" cy="39" rx="9" ry="7" fill="#ffc2dd" opacity="0.3" filter="url(#blur2)"/>

    <!-- overall sheen -->
    <rect x="0" y="0" width="48" height="46" fill="url(#glow)"/>

    <!-- flower -->
    <g filter="url(#softShadow)">
      <g transform="translate(24,23)">
        <!-- 6 rounded petals arranged around center -->
        <g fill="url(#petal)">
          <ellipse cx="0" cy="-8" rx="5.2" ry="8.6"/>
          <ellipse cx="0" cy="-8" rx="5.2" ry="8.6" transform="rotate(60)"/>
          <ellipse cx="0" cy="-8" rx="5.2" ry="8.6" transform="rotate(120)"/>
          <ellipse cx="0" cy="-8" rx="5.2" ry="8.6" transform="rotate(180)"/>
          <ellipse cx="0" cy="-8" rx="5.2" ry="8.6" transform="rotate(240)"/>
          <ellipse cx="0" cy="-8" rx="5.2" ry="8.6" transform="rotate(300)"/>
        </g>
        <!-- flower center -->
        <circle cx="0" cy="0" r="5.4" fill="url(#core)"/>
        <circle cx="-1.6" cy="-1.8" r="1.5" fill="#fff8e6" opacity="0.75"/>
      </g>
    </g>
  </g>
</svg>
